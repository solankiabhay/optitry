plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.optitry.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.optitry.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'
    implementation 'com.google.mediapipe:tasks-vision:0.10.21'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    testImplementation 'junit:junit:4.13.2'
}

// Download the official free MediaPipe model so local and CI builds have the same asset.
def faceModel = file('src/main/assets/face_landmarker.task')
tasks.register('downloadFaceLandmarkerModel') {
    outputs.file(faceModel)
    doLast {
        if (!faceModel.exists() || faceModel.length() < 1000000L) {
            faceModel.parentFile.mkdirs()
            new URL('https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task').withInputStream { input ->
                faceModel.withOutputStream { output -> output << input }
            }
            if (faceModel.length() < 1000000L) {
                throw new GradleException('MediaPipe face landmark model download failed or returned an invalid file.')
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn('downloadFaceLandmarkerModel') }

// CI runs only `assembleDebug`; tie the JVM unit tests to it so a failing test fails the build.
afterEvaluate {
    tasks.named('assembleDebug').configure { dependsOn('testDebugUnitTest') }
}
